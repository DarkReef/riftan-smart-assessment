name: Module release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check release version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('module.json')).version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "Release tag does not match module.json" >&2
            exit 1
          fi
      - run: zip -r riftan-smart-assessment.zip module.json scripts templates lang style.css action-reference.css damage.css LICENSE README.md RELEASE.md docs
      - run: python tools/check_release.py riftan-smart-assessment.zip module.json
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('module.json')).version")
          OPTIONS=(--draft)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then OPTIONS=(--verify-tag); fi
          gh release create "v${VERSION}" riftan-smart-assessment.zip module.json --target "$GITHUB_SHA" "${OPTIONS[@]}" --notes-file RELEASE.md
